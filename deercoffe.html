<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deer Coffee · Datos de transferencia</title>
<style>
  :root {
    --bg: #2a1d15;
    --surface: #3a2a20;
    --line: #56402f;
    --text: #f3e9dc;
    --muted: #c4ad96;
    --accent: #e8b563;
    --accent-ink: #2a1d15;
    --ok: #9bd08f;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f3e9dc;
      --surface: #fff8ee;
      --line: #dcc8ae;
      --text: #2a1d15;
      --muted: #6e5846;
      --accent: #5a3820;
      --accent-ink: #fff8ee;
      --ok: #2f6b2a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 18px 56px;
  }
  main { width: 100%; max-width: 440px; }
  h1 {
    font-size: clamp(2.6rem, 12vw, 3.6rem);
    line-height: 1;
    margin: 0 0 6px;
    letter-spacing: .02em;
    font-weight: 700;
  }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 1.05rem; }
  .row {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .row small { display: block; color: var(--muted); font-size: .85rem; margin-bottom: 2px; }
  .row span { font-size: 1.12rem; overflow-wrap: anywhere; }
  button {
    font: inherit;
    font-size: .95rem;
    border: 0;
    border-radius: 8px;
    padding: 9px 14px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    flex-shrink: 0;
  }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  button.done { background: var(--ok); color: #10200e; }
  .all { width: 100%; margin-top: 14px; padding: 15px; font-size: 1.05rem; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>DEER COFFEE</h1>
  <p class="sub">Datos para transferir</p>

  <div class="row"><div><small>RUT</small><span>779691519</span></div><button data-copy="779691519">Copiar</button></div>
  <div class="row"><div><small>Banco</small><span>Mercado Pago</span></div><button data-copy="Mercado Pago">Copiar</button></div>
  <div class="row"><div><small>Tipo de cuenta</small><span>Cuenta Vista</span></div><button data-copy="Cuenta Vista">Copiar</button></div>
  <div class="row"><div><small>Número de cuenta</small><span>1042324486</span></div><button data-copy="1042324486">Copiar</button></div>
  <div class="row"><div><small>Correo</small><span>deercoffeechile@gmail.com</span></div><button data-copy="deercoffeechile@gmail.com">Copiar</button></div>

  <button class="all" id="all">Copiar todos los datos</button>
</main>

<script>
  var TODO = "DEER COFFEE\nRUT: 779691519\nMercado Pago\nCuenta Vista\nNúmero de cuenta: 1042324486\ndeercoffeechile@gmail.com";

  function copiar(texto) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(texto);
    }
    return new Promise(function (ok, fail) {
      var t = document.createElement("textarea");
      t.value = texto;
      t.style.position = "fixed";
      t.style.opacity = "0";
      document.body.appendChild(t);
      t.select();
      try { document.execCommand("copy") ? ok() : fail(); } catch (e) { fail(e); }
      document.body.removeChild(t);
    });
  }

  function marcar(btn, original) {
    btn.textContent = "Copiado";
    btn.classList.add("done");
    setTimeout(function () {
      btn.textContent = original;
      btn.classList.remove("done");
    }, 1800);
  }

  document.querySelectorAll("button[data-copy]").forEach(function (b) {
    b.addEventListener("click", function () {
      copiar(b.getAttribute("data-copy")).then(function () { marcar(b, "Copiar"); });
    });
  });

  var all = document.getElementById("all");
  all.addEventListener("click", function () {
    copiar(TODO).then(function () { marcar(all, "Copiar todos los datos"); });
  });
</script>
</body>
</html>
